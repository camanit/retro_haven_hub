<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroHaven Emulator Player</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game {
            width: 100%;
            height: 100%;
        }
        .error-message {
            color: #ff3333;
            font-family: 'Share Tech Mono', monospace, sans-serif;
            text-align: center;
            padding: 20px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="game"></div>
    </div>
    <script>
        // Retrieve file and system from parent window
        const file = window.parent.currentRomFile;
        const system = window.parent.currentSystem;

        if (file && system) {
            // Append hash fragment with real filename so EmulatorJS detects the extension and auto-boots
            const gameUrl = URL.createObjectURL(file) + '#' + file.name;
            
            // Map the system key to the correct EmulatorJS core identifier
            let core = '';
            if (system === 'gb') core = 'gb';
            else if (system === 'nes') core = 'nes';
            else if (system === 'psp') core = 'ppsspp';
            else if (system === 'psx') core = 'psx';
            else if (system === 'dos') core = 'dosbox_pure';

            // Configure EmulatorJS
            window.EJS_player = '#game';
            window.EJS_core = core;
            window.EJS_gameUrl = gameUrl;
            window.EJS_gameName = file.name;
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            window.EJS_startOnLoaded = true; // Auto start the game once files load
            window.EJS_threads = true; // Enable multithreading required by PPSSPP core

            // Load EmulatorJS script dynamically
            const loader = document.createElement('script');
            loader.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            document.body.appendChild(loader);

            // Clean up the object URL when the window is unloaded to free memory
            window.addEventListener('unload', () => {
                URL.revokeObjectURL(gameUrl);
            });
        } else {
            document.getElementById('game-container').innerHTML = `
                <div class="error-message">
                    <h3>❌ ERROR</h3>
                    <p>Game file or system context not found. Please drag and drop the file again in RetroHaven.</p>
                </div>
            `;
        }
    </script>
</body>
</html>
